# 小模型派生（Lot 4）和向量索引的可配置项。
# CONVENTIONS §4.8：这里只留提示词裁剪上限、价格快照、embedding；模型名和接口地址只认插件设置（data.json），
# 不再从这里回落。概要用哪个模型 = 设置里的「归档摘要模型」（默认和文本 AI 相同）。

# 价格快照（USD / 1M token），按模型名查；查不到的模型费用记 0（只影响 extracted.json 里的估算）。
# qwen3.7-flash：2026-09-04 取自 Qwen 官方 model-pricing 页。换模型时把它的价格也加进来。
pricing:
  qwen3.7-flash:
    input_usd_per_1m: 0.028
    output_usd_per_1m: 0.110

# 输入裁剪上限：喂给模型的只有正文 + OCR + 评论，绝不塞 mcp_raw.json
limits:
  body_chars: 4000
  ocr_chars_per_image: 500
  comment_chars: 300
  max_comments: 40
  max_tags: 8

# Lot B：embedding 旁挂（可选层）。拿不到 key / 没跑过 `python -m link_brain embed` /
# numpy 缺失时，检索退纯词法，行为与没有这一层完全一致（fail-open 硬约束）。
# 接口和 key 在设置的 embedAI（默认：环境变量 DASHSCOPE_API_KEY + 百炼 OpenAI 兼容 /embeddings），绝不写进本仓。
embedding:
  # 本机 key 走的 MaaS 网关没有 text-embedding-v4，用它有的 qwen3.7 embedding flash
  model: qwen3.7-text-embedding-flash
  # 留空 = 用 embedAI 的接口地址；这里写完整 URL 会盖过它
  endpoint: ""
  dimensions: 1024
  # 查询向量单次 HTTP 超时（秒）；超时/失败即退纯词法
  query_timeout_sec: 5
