[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "link-brain"
version = "0.1.0"
description = "light-web-archieve: 小红书链接归档基座（RAW 不可变 + Obsidian 可见笔记）"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pypinyin>=0.55",
    "jieba>=0.42.1",
    # 本地 OCR（带位置框，判断表格用）与视频画面文字；CPU 即可，首次用到才加载
    "rapidocr>=3.9",
    "onnxruntime>=1.17",
    "rapidfuzz>=3.0",
    # 语义检索（向量索引 semantic.db）；缺了会静默退回纯关键词。也用于语音切段
    "numpy>=1.26",
    # 附件 PDF / Word 转 Markdown（随包自带，不依赖仓库外脚本）：pypdfium2 Apache-2.0/BSD-3，python-docx MIT
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    # 语音识别连本机 CapsWriter-Offline 服务端（websocket）：BSD-3
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
link-brain = "link_brain.cli:main"

[tool.setuptools.packages.find]
include = ["link_brain*"]

[tool.setuptools.package-data]
link_brain = ["assets/*.js", "assets/*.css", "assets/*.json", "assets/*.yaml", "assets/*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "real_web_probe: 跳过 conftest 的联网拦截（用例自己 monkeypatch httpx）",
    "real_embeddings: 跳过 conftest 的 embedding HTTP 拦截（用例保证不带 key、不出网）",
]
