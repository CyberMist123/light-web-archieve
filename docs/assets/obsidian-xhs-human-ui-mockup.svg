  <rect x="50" y="842" rx="12" ry="12" width="1300" height="38" class="soft"/>
  <text x="70" y="867" class="small muted">实现边界：只改 render + CSS；人版不含 AI summary/OCR；不显示缩略图、原帖入口、机器属性；视频只显示封面 +「视频 · 未下载」。</text>
