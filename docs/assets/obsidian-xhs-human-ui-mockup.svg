<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg{fill:#f7f7f9}.card{fill:#fff;stroke:#dcdde3;stroke-width:2}.muted{fill:#8a8f98}.text{fill:#202124}.soft{fill:#f3f5f8}.accent{fill:#ff2e4d}.blue{fill:#eef5ff}.line{stroke:#e5e7eb;stroke-width:1.5}.reply{stroke:#dfe3ea;stroke-width:2}.title{font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif}.h2{font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif}.body{font:16px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif}.small{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif}.tiny{font:12px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif}.label{font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;fill:#555b66}
    </style>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce8d7"/><stop offset="0.55" stop-color="#c7d7bd"/><stop offset="1" stop-color="#b7c8aa"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" class="bg"/>
  <text x="56" y="60" class="title text">Obsidian · 小红书风格人类阅读版</text>
